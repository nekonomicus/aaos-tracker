<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>FMH MUSTS</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="wordmark">FMH MUSTS</span><span class="sub" id="countdown"></span></div>
  <div class="stats" id="stats"></div>
  <div class="top-actions">
    <button class="btn ghost" id="btn-new" title="Neues Gespräch">NEU</button>
    <select id="threads" class="select" title="Frühere Gespräche"></select>
    <button class="btn ghost gear" id="btn-settings" title="Einstellungen">⚙</button>
  </div>
</header>

<main class="app">
  <aside class="matrix" id="matrix"></aside>
  <section class="chat">
    <div class="messages" id="messages"></div>
    <div class="composer">
      <div class="chips" id="chips">
        <button data-chip="open">5 offene Fälle</button>
        <button data-chip="weak">Schwächen drillen</button>
        <button data-chip="set">Fragenset</button>
        <button data-chip="excel">Excel dazu</button>
      </div>
      <div class="input-row">
        <textarea id="input" rows="1" placeholder="Nachricht …"></textarea>
        <button class="btn" id="btn-note" title="Notiz zum aktuellen Fall">NOTIZ</button>
        <button class="btn mic" id="btn-mic" title="Diktieren (Aufnahme starten / stoppen)">● SPRECHEN</button>
        <button class="btn primary" id="btn-send">SENDEN</button>
      </div>
    </div>
  </section>
</main>

<div class="modal" id="case-modal" hidden>
  <div class="modal-box" id="case-box"></div>
</div>
<div class="modal" id="settings-modal" hidden>
  <div class="modal-box" id="settings-box"></div>
</div>
<div id="toast" class="toast" hidden></div>

<script src="data/cases.js"></script>
<script src="data/notes.js"></script>
<script src="prompts.js"></script>
<script src="app.js"></script>
</body>
</html>
