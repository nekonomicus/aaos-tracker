<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CHF ⇄ JPY / KRW</title>
<style>
  :root { --bg:#fff; --fg:#111; --mut:#888; --line:#ddd; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111; --fg:#eee; --mut:#888; --line:#333; }
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    background:var(--bg); color:var(--fg);
    font:16px/1.4 system-ui, -apple-system, sans-serif;
    display:flex; min-height:100dvh; align-items:center; justify-content:center;
  }
  main { width:min(26rem, 100%); padding:1.5rem; }
  .row { display:flex; align-items:baseline; gap:.75rem; padding:1rem 0; border-bottom:1px solid var(--line); }
  .row:last-of-type { border-bottom:none; }
  label { width:3.2em; font-weight:600; color:var(--mut); font-size:1.1rem; }
  input {
    flex:1; width:100%; border:none; background:none; color:var(--fg);
    font:inherit; font-size:2rem; font-variant-numeric:tabular-nums;
    text-align:right; outline:none;
  }
  input::placeholder { color:var(--mut); }
  footer { margin-top:1.25rem; text-align:center; color:var(--mut); font-size:.8rem; }
</style>
</head>
<body>
<main>
  <div class="row"><label for="CHF">CHF</label><input id="CHF" inputmode="decimal" autocomplete="off" placeholder="0" autofocus></div>
  <div class="row"><label for="JPY">JPY</label><input id="JPY" inputmode="decimal" autocomplete="off" placeholder="0"></div>
  <div class="row"><label for="KRW">KRW</label><input id="KRW" inputmode="decimal" autocomplete="off" placeholder="0"></div>
  <footer id="status">loading rates…</footer>
</main>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const status = $('status');
  let rates = { CHF: 1 }; // per 1 CHF

  const saved = localStorage.getItem('chfrates');
  if (saved) apply(JSON.parse(saved));

  fetch('https://api.frankfurter.dev/v1/latest?base=CHF&symbols=JPY,KRW')
    .then(r => r.json())
    .catch(() => fetch('https://open.er-api.com/v6/latest/CHF').then(r => r.json())
      .then(d => ({ date: d.time_last_update_utc.slice(5, 16), rates: { JPY: d.rates.JPY, KRW: d.rates.KRW } })))
    .then(d => { localStorage.setItem('chfrates', JSON.stringify(d)); apply(d); })
    .catch(() => { if (!saved) status.textContent = 'offline — no rates'; });

  function apply(d) {
    rates = { CHF: 1, ...d.rates };
    status.textContent = `1 CHF = ${d.rates.JPY} JPY = ${d.rates.KRW} KRW · ${d.date}`;
  }

  function fmt(n, cur) {
    if (!isFinite(n)) return '';
    return cur === 'CHF'
      ? (Math.round(n * 100) / 100).toString()
      : Math.round(n).toString();
  }

  for (const id of ['CHF', 'JPY', 'KRW']) {
    $(id).addEventListener('input', () => {
      const v = parseFloat($(id).value.replace(',', '.'));
      const chf = v / rates[id];
      for (const other of ['CHF', 'JPY', 'KRW']) {
        if (other === id) continue;
        $(other).value = $(id).value === '' || !isFinite(chf) ? '' : fmt(chf * rates[other], other);
      }
    });
  }
})();
</script>
</body>
</html>
