<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>為替 FX-9000</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    background:#06020f;
    color:#0ff;
    font-family:ui-monospace, 'Courier New', monospace;
    display:flex; min-height:100dvh; align-items:center; justify-content:center;
    overflow-x:hidden;
  }
  /* CRT scanlines + vignette */
  body::before {
    content:''; position:fixed; inset:0; pointer-events:none; z-index:9;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 1px, transparent 1px 3px),
      radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%);
  }
  main {
    width:min(34rem, 100%); margin:1rem; padding:0 0 1rem;
    border:1px solid #ff2e97;
    box-shadow:0 0 12px rgba(255,46,151,.55), inset 0 0 24px rgba(255,46,151,.12);
    background:rgba(10,4,24,.9);
  }
  header {
    display:flex; justify-content:space-between; align-items:center;
    padding:.5rem .9rem; border-bottom:1px solid #ff2e97;
    color:#ff2e97; text-shadow:0 0 8px #ff2e97;
    font-size:clamp(.8rem, 2.5vw, 1rem); letter-spacing:.15em;
    animation:flicker 4s infinite;
  }
  header b::after { content:'▮'; margin-left:.4em; animation:blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0; } }
  @keyframes flicker { 0%,93%,97%,100% { opacity:1; } 94%,96% { opacity:.6; } }
  .row {
    display:flex; align-items:center; gap:1rem;
    padding:.9rem 1rem .5rem; border-bottom:1px dashed rgba(0,255,255,.25);
  }
  label { color:#ff2e97; text-shadow:0 0 6px #ff2e97; line-height:1.15; }
  label b { display:block; font-size:clamp(1.1rem, 4vw, 1.5rem); letter-spacing:.1em; }
  label small { font-size:.7rem; opacity:.8; }
  input {
    flex:1; width:100%; min-width:0; border:none; background:none; outline:none;
    color:#0ff; text-shadow:0 0 9px rgba(0,255,255,.9);
    caret-color:#0ff;
    font:inherit; font-size:clamp(2.1rem, 9vw, 3.2rem);
    font-variant-numeric:tabular-nums; text-align:right;
  }
  input::placeholder { color:rgba(0,255,255,.35); text-shadow:none; }
  input:focus { text-shadow:0 0 14px #0ff, 0 0 3px #fff; }
  footer {
    padding:.9rem 1rem 0; color:#39ff14; text-shadow:0 0 7px rgba(57,255,20,.8);
    font-size:clamp(.72rem, 2.4vw, .9rem); word-break:break-word;
  }
  footer::before { content:'> '; }
</style>
</head>
<body>
<main>
  <header><b>為替端末 FX-9000</b><span>TOKYO ⇄ ZÜRICH</span></header>
  <div class="row"><label for="CHF"><b>CHF</b><small>フラン</small></label><input id="CHF" inputmode="decimal" autocomplete="off" placeholder="0" autofocus></div>
  <div class="row"><label for="EUR"><b>EUR</b><small>ユーロ</small></label><input id="EUR" inputmode="decimal" autocomplete="off" placeholder="0"></div>
  <div class="row"><label for="JPY"><b>JPY</b><small>円</small></label><input id="JPY" inputmode="decimal" autocomplete="off" placeholder="0"></div>
  <div class="row"><label for="KRW"><b>KRW</b><small>ウォン</small></label><input id="KRW" inputmode="decimal" autocomplete="off" placeholder="0"></div>
  <footer id="status">LOADING RATES…</footer>
</main>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const status = $('status');
  let rates = { CHF: 1 }; // per 1 CHF

  const saved = localStorage.getItem('chfrates2');
  if (saved) apply(JSON.parse(saved));

  fetch('https://api.frankfurter.dev/v1/latest?base=CHF&symbols=EUR,JPY,KRW')
    .then(r => r.json())
    .catch(() => fetch('https://open.er-api.com/v6/latest/CHF').then(r => r.json())
      .then(d => ({ date: d.time_last_update_utc.slice(5, 16), rates: { EUR: d.rates.EUR, JPY: d.rates.JPY, KRW: d.rates.KRW } })))
    .then(d => { localStorage.setItem('chfrates2', JSON.stringify(d)); apply(d); })
    .catch(() => { if (!saved) status.textContent = 'OFFLINE — NO RATES'; });

  function apply(d) {
    rates = { CHF: 1, ...d.rates };
    status.textContent = `1 CHF = ${d.rates.EUR} EUR = ${d.rates.JPY} JPY = ${d.rates.KRW} KRW [${d.date}]`;
  }

  function fmt(n, cur) {
    if (!isFinite(n)) return '';
    return cur === 'CHF' || cur === 'EUR'
      ? (Math.round(n * 100) / 100).toString()
      : Math.round(n).toString();
  }

  for (const id of ['CHF', 'EUR', 'JPY', 'KRW']) {
    $(id).addEventListener('input', () => {
      const v = parseFloat($(id).value.replace(',', '.'));
      const chf = v / rates[id];
      for (const other of ['CHF', 'EUR', 'JPY', 'KRW']) {
        if (other === id) continue;
        $(other).value = $(id).value === '' || !isFinite(chf) ? '' : fmt(chf * rates[other], other);
      }
    });
  }
})();
</script>
</body>
</html>
